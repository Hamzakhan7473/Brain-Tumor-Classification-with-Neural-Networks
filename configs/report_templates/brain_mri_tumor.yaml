template_id: brain_mri_tumor
name: "Brain MRI · Mass / Tumor screening (RSNA-derived)"
modality: MR
body_region: brain
indication_default: "Brain MRI for mass or neoplasm evaluation."
technique_default: |
  MRI brain with and without contrast as clinically indicated. Sequences
  include axial T1, T2, FLAIR, DWI, and post-contrast T1. Scanner field
  strength {{scanner_field_strength}}.
comparison_default: "No prior brain MRI available for comparison."

finding_regions:
  - id: mass_region
    label: Supratentorial parenchyma
    measurement_ids: []
    fallback: "Slice-wise research classifier suggested class; not used for measurement or signature."

  - id: ventricles
    label: Ventricles
    measurement_ids: []
    fallback: "Ventricles are normal in size and configuration."

  - id: vasculature
    label: Vasculature
    measurement_ids: []
    fallback: "No acute territorial infarct on DWI."

impression_rules:
  - condition: "model_confidence_raw >= 0"
    severity: normal
    template: |
      Slice-wise research classifier suggested class {{predicted_label}}; not used for measurement or signature.

recommendation_rules:
  - severity_in: [mild, moderate, severe]
    text: "**Dedicated neuroradiology review** of the complete MRI including contrast phases if obtained [cite:aha_2024]."
  - severity_in: [normal]
    text: "**Routine clinical follow-up** at physician discretion."

citations:
  aha_2024:
    label: "AHA/ASA Guidelines 2024"
    source_type: guideline
    location: "Section 4.3 · p. 28"
    snippet: "Multidisciplinary review recommended when imaging suggests cerebrovascular or neoplastic risk."
